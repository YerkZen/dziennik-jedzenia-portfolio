        - carbs_goal
        - revision
        - created_at
        - updated_at
      properties:
        id: *id004
        effective_from: *id005
        kcal_goal: &id015
          $ref: "#/components/schemas/PositiveDecimal"
        protein_goal: &id016
          $ref: "#/components/schemas/PositiveDecimal"
        fat_goal: &id017
          $ref: "#/components/schemas/PositiveDecimal"
        carbs_goal: &id018
          $ref: "#/components/schemas/PositiveDecimal"
        revision: *id006
        created_at: *id013
        updated_at: *id013
    GoalView:
      type: object
      additionalProperties: false
      required:
        - date
        - current
        - today_id
        - today_revision
      properties:
        date: *id005
        current:
          anyOf:
            - $ref: "#/components/schemas/GoalVersion"
            - type: "null"
        today_id:
          anyOf:
            - *id004
            - type: "null"
        today_revision:
          type: integer
          minimum: 0
          maximum: 2147483647
      description: current to cel obowiązujący dla date. today_revision=0 gdy brak
        wersji dzisiejszej, niezależnie od wersji dziedziczonej. today_id wskazuje
        dzisiejszy rekord lub null.
    GoalsWrite:
      type: object
      additionalProperties: false
      required:
        - id
        - expected_date
        - kcal_goal
        - protein_goal
        - fat_goal
        - carbs_goal
      properties:
        id: *id004
        expected_date: *id005
        kcal_goal: *id015
        protein_goal: *id016
        fat_goal: *id017
        carbs_goal: *id018
      description: id nowy przed pierwszą próbą albo today_id przy edycji. expected_date
        musi być dzisiejsza w Europe/Warsaw. If-Match 0 tworzy tylko gdy brak dzisiejszej
        wersji; >0 porównuje dzisiejszą revision.
    Day:
      type: object
      additionalProperties: false
      required:
        - date
        - timezone
        - meals
        - totals
        - goals
        - remaining_kcal
        - percentages
      properties:
        date: *id005
        timezone:
          type: string
          const: Europe/Warsaw
        meals:
          type: array
          items:
            $ref: "#/components/schemas/DiaryMeal"
        totals:
          $ref: "#/components/schemas/Nutrients"
        goals:
          anyOf:
            - $ref: "#/components/schemas/GoalVersion"
            - type: "null"
        remaining_kcal:
          anyOf:
            - $ref: "#/components/schemas/SignedDecimal"
            - type: "null"
        percentages:
          anyOf:
            - $ref: "#/components/schemas/Percentages"
            - type: "null"
      description: Spójny odczyt SQL. Brak posiłków daje zera, brak celu daje null
        w goals/remaining/percentages. Soft-deleted posiłki pominięte. Sumy z diary_item,
        bez aktualnych produktów.
    LabelProposal:
      type: object
      additionalProperties: false
      required:
        - name
        - basis_status
        - basis_unit
        - kcal_per_100
        - protein_per_100
        - fat_per_100
        - carbs_per_100
        - missing_fields
        - warnings
      properties:
        name:
          anyOf:
            - *id007
            - type: "null"
        basis_status:
          type: string
          enum:
            - per_100
            - per_portion
            - unknown
        basis_unit:
          anyOf:
            - *id012
            - type: "null"
        kcal_per_100:
          anyOf:
            - *id008
            - type: "null"
        protein_per_100:
          anyOf:
            - *id009
            - type: "null"
        fat_per_100:
          anyOf:
            - *id010
            - type: "null"
        carbs_per_100:
          anyOf:
            - *id011
            - type: "null"
        missing_fields:
          type: array
          items:
            type: string
            enum:
              - name
              - basis_unit
              - kcal_per_100
              - protein_per_100
              - fat_per_100
              - carbs_per_100
          uniqueItems: true
        warnings:
          type: array
          items:
            type: string
      description: Brakujące dane null, nie zero. per_portion/unknown wymaga null
        dla wartości na 100 i ręcznego uzupełnienia. Odczyt niczego nie zapisuje.
        Wymagana korekta/zatwierdzenie nawet przy komplecie.
      allOf:
        - if:
            properties:
              basis_status:
                enum:
                  - per_portion
                  - unknown
          then:
            properties:
              kcal_per_100:
                type: "null"
              protein_per_100:
                type: "null"
              fat_per_100:
                type: "null"
              carbs_per_100:
                type: "null"
    PwaManifest:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - short_name
        - start_url
        - scope
        - display
        - lang
        - theme_color
        - background_color
        - icons
      properties:
        id:
          type: string
          const: /
        name:
          type: string
          const: Dziennik Jedzenia
        short_name:
          type: string
          const: Dziennik
        start_url:
          type: string
          const: /
        scope:
          type: string
          const: /
        display:
          type: string
          const: standalone
        lang:
          type: string
          const: pl
        theme_color:
          type: string
        background_color:
          type: string
        icons:
          type: array
          items:
            type: object
            additionalProperties: false
            required:
              - src
              - sizes
              - type
            properties:
              src:
                type: string
              sizes:
                type: string
              type:
                type: string
              purpose:
                type: string
          minItems: 2
      description: Publiczny plik statyczny, bez danych użytkownika; nie dowodzi instalacji
        na fizycznym urządzeniu.
  responses:
    BadRequest:
      description: Błędny JSON/multipart, UUID lub nagłówek. code=BAD_REQUEST.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Brak/wygasła sesja. code=SESSION_REQUIRED lub SESSION_EXPIRED.
        Bez potwierdzenia zapisu.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Obcy właściciel, origin lub brak nagłówka CSRF. code=FORBIDDEN.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Rekord nie istnieje/nie należy do właściciela. code=NOT_FOUND.
        Usunięty posiłek nie jest przywracany.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: REVISION_CONFLICT, PRODUCT_CHANGED, PRODUCT_ARCHIVED, TEMPLATE_CHANGED,
        TEMPLATE_ARCHIVED, RESOURCE_DELETED, IDEMPOTENCY_MISMATCH, ID_EXISTS lub DAY_CHANGED.
        Bez nadpisania; szkic pozostaje.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unprocessable:
      description: "Naruszenie BR-02..06: błędne pola, ilość/precyzja, pusty agregat,
        niepoprawna/przyszła data. code=VALIDATION_ERROR i field_errors."
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PreconditionRequired:
      description: Brak wymaganego If-Match. code=PRECONDITION_REQUIRED.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Limit API lub Workers AI Free. code=RATE_LIMIT lub AI_LIMIT. Bez
        płatnego fallbacku.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
        Retry-After:
          schema:
            type: integer
            minimum: 1
          description: Sekundy do kolejnej próby; przy limicie AI do resetu UTC, jeśli
            znany.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: Zależność chwilowo niedostępna. code=SERVICE_UNAVAILABLE, AI_UNAVAILABLE
        lub AI_INVALID_RESPONSE. Nie oznacza pewności, że wcześniejsza mutacja nie
        została zapisana.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PayloadTooLarge:
      description: Obraz >10 MiB lub body >ustalonego limitu. code=PAYLOAD_TOO_LARGE;
        obraz nie trafia do AI.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description:
        Nieobsługiwany lub niezgodny z sygnaturą format, np. HEIC. code=UNSUPPORTED_IMAGE;
        wybierz JPEG/PNG/WebP.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    GatewayTimeout:
      description: Upstream nie zdążył w deadline serwera. code=AI_TIMEOUT; UI niezależnie
        kończy oczekiwanie <=30 s od wysłania.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    InternalError:
      description: Nieoczekiwany błąd. code=INTERNAL_ERROR; brak stack trace/SQL/surowego
        modelu.
      headers:
        Cache-Control: *id001
        X-Request-ID: *id002
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
