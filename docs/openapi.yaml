      description: Pełna lista; pominięcie usuwa składnik tylko z tego posiłku. Nowy
        UUID oznacza świadome pobranie aktualnych wartości. Nie przyjmować snapshotu
        od klienta.
    DiaryItem:
      type: object
      additionalProperties: false
      required:
