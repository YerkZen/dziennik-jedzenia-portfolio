# Publiczny kontrakt API aplikacji.
openapi: 3.1.0
info:
  title: Dziennik Jedzenia API
  version: 1.1.0
  description: "Kontrakt API: prywatny dziennik, statystyki dziennych kcal
    i pomiarów wagi. Jeden właściciel, Europe/Warsaw, sesja cookies, Supabase RLS.
    Backup i odzyskiwanie konta to operacje operatora, poza API. Wydanie wymaga migracji
    24–26; wdrożenie wymaga osobnej konfiguracji operatora."
  license:
    name: Private project; license not specified
servers:
  - url: /api/v1
    description: Ten sam HTTPS origin co SPA (lokalny/prod), bez wymyślonego hosta produkcyjnego.
security:
  - accessCookie: []
tags:
  - name: auth
    description: Prywatne konto i sesja BFF
  - name: products
    description: Baza produktów
  - name: templates
    description: Zestawy składników
  - name: diary
    description: Posiłki i historia
  - name: goals
    description: Wersjonowane cele
  - name: labels
    description: Odczyt etykiety do korekty
  - name: pwa
    description: Publiczna instalacja PWA
  - name: statistics
    description: Statystyki kalorii i wagi
paths:
  /session:
    post:
      operationId: createSession
      tags:
        - auth
      summary: Zaloguj przygotowanego właściciela
      description: Zaloguj przygotowanego właściciela
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Sukces; przy mutacji odpowiedź po zatwierdzeniu transakcji.
          headers:
            Cache-Control: &id001
              schema:
                type: string
                const: no-store
              description: Brak cache prywatnych danych.
            X-Request-ID: &id002
              schema: &id004
                type: string
                format: uuid
              description: Identyfikator techniczny bez treści prywatnej.
            Set-Cookie: &id003
              schema:
                type: string
              description: "Dwa osobne nagłówki Set-Cookie: __Host-dd-access i __Host-dd-refresh;
                Secure, HttpOnly, SameSite=Strict, Path=/, bez Domain."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Login"
      security: []
    get:
      operationId: getSession
      tags:
        - auth
      summary: Sprawdź sesję i właściciela
      description: Sprawdź sesję i właściciela
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
        "200":
          description: Sukces; przy mutacji odpowiedź po zatwierdzeniu transakcji.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    delete:
      operationId: deleteSession
      tags:
        - auth
      summary: Wyloguj bieżące urządzenie
      description: Idempotentne usunięcie cookies również gdy access wygasł lub cookies
        nie ma. Odwołanie bieżącej sesji u dostawcy jeśli dostępna. Przy awarii Auth
        nadal czyści cookies; UI usuwa dane. Offline patrz security.md.
      responses:
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/Unavailable"
        "500":
          $ref: "#/components/responses/InternalError"
        "204":
          description: Operacja zakończona bez treści; cookies sesji usunięte.
          headers:
            Cache-Control: *id001
            X-Request-ID: *id002
            Set-Cookie:
              schema:
                type: string
              description: Wygaszenie obu cookies z Max-Age=0 i identyczną ścieżką;
                osobny nagłówek dla każdego cookie.
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      security: []
  /session/refresh:
    post:
      operationId: refreshSession
      tags:
        - auth
      summary: Odśwież sesję przez BFF
      description: Jedyny punkt rotacji poza loginem. Klient serializuje wywołania
        między kartami; bez tokenów w JSON.
