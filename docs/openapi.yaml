components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Host-dd-access
      description: JWT Supabase; Secure, HttpOnly, SameSite=Strict, Path=/.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-dd-refresh
      description: Rotowany refresh token; tylko BFF.
  parameters:
    Csrf:
      name: X-Requested-With
      in: header
      required: true
      schema:
        type: string
        const: DziennikJedzenia
      description: Wymagane także dla loginu/refresh/logout/OCR; dodatkowo serwer
        sprawdza Origin == APP_ORIGIN.
    Origin:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
      description: W przeglądarce ustawiany automatycznie. Dokładnie APP_ORIGIN; brak
        lub inny origin odrzucany.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: *id004
      description: Stały UUID tej samej mutacji i identycznego payloadu; zachować
        po utracie odpowiedzi. Reuse z inną treścią =409.
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
      description: Silny ETag rewizji np. "3"; jej brak 428, konflikt 409.
    GoalIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"(0|[1-9][0-9]*)"$
      description: '"0" gdy brak dzisiejszego celu, inaczej today_revision z GET /goals.'
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 160
        default: ""
      description: Fragment nazwy bez rozróżnienia wielkości liter; % i _ to literały,
        nie wildcards.
    ArchiveFilter:
      name: include_archived
      in: query
      schema:
        type: boolean
        default: false
    WeightIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"(0|[1-9][0-9]*)"$
      description: 0 tylko dla pierwszego PUT; po usunięciu użyj rewizji tombstone.
        Max 2147483647. Brak 428, nieprawidłowa składnia 400, nieaktualna rewizja
        409.
  schemas:
    WeightKg:
      type: string
      pattern: ^(?!0(?:\.0{1,2})?$)(?:0|[1-9][0-9]{0,2})(?:\.[0-9]{1,2})?$
      description: 0.01..999.99 kg. String z kropką, bez wykładnika i cichego zaokrąglania.
    WeightWrite:
      type: object
      additionalProperties: false
      required:
        - weight_kg
      properties:
        weight_kg:
          $ref: "#/components/schemas/WeightKg"
    StatisticsDay:
      type: object
      additionalProperties: false
      required:
        - date
        - kcal
        - meal_count
        - weight_kg
        - weight_revision
      properties:
        date:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        kcal:
          oneOf:
            - $ref: "#/components/schemas/TotalDecimal"
            - type: "null"
        meal_count:
          type: integer
          minimum: 0
        weight_kg:
          oneOf:
            - $ref: "#/components/schemas/WeightKg"
            - type: "null"
        weight_revision:
          type: integer
          minimum: 0
          maximum: 2147483647
    Statistics:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - today
        - timezone
        - days
      properties:
        from:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        to:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        today:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        timezone:
          type: string
          const: Europe/Warsaw
        days:
          type: array
          minItems: 1
          maxItems: 366
          items:
            $ref: "#/components/schemas/StatisticsDay"
    WeightMutation:
      type: object
      additionalProperties: false
      required:
        - date
        - applied_revision
        - current_revision
        - replayed
        - deleted
      properties:
        date:
          type: string
          format: date
          pattern: ^\d{4}-\d{2}-\d{2}$
        applied_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        current_revision:
          type: integer
          minimum: 1
          maximum: 2147483647
        replayed:
          type: boolean
        deleted:
          type: boolean
          description: Bieżący stan, także przy replay.
    Decimal:
      type: string
      pattern: ^(0|[1-9][0-9]{0,7})(\.[0-9]{1,2})?$
      description: Liczba dziesiętna 0..99999999.99 jako string, maks. 2 miejsca;
        brak cichego zaokrąglenia.
      examples:
        - "350"
        - "3.40"
    PositiveDecimal:
      allOf:
        - $ref: "#/components/schemas/Decimal"
        - not:
            pattern: ^0(\.0{1,2})?$
      description: Jak Decimal, ale ściśle większe od zera.
    TotalDecimal:
      type: string
      pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
      description: Dokładny wynik bez limitu wejściowego; zaokrąglenie half-up dopiero
        w UI.
    SignedDecimal:
      type: string
      pattern: ^-?(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
    Nutrients:
      type: object
      additionalProperties: false
      required:
        - kcal
        - protein
        - fat
        - carbs
      properties:
        kcal:
          $ref: "#/components/schemas/TotalDecimal"
        protein:
          $ref: "#/components/schemas/TotalDecimal"
        fat:
          $ref: "#/components/schemas/TotalDecimal"
        carbs:
          $ref: "#/components/schemas/TotalDecimal"
    Percentages:
      type: object
      additionalProperties: false
      required:
        - kcal
        - protein
        - fat
        - carbs
      properties:
        kcal:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
        protein:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
        fat:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
        carbs:
          type: string
          pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,2})?$
      description: Procent może przekroczyć 100; half-up do dwóch miejsc. Pasek UI
        ograniczony do 100%.
    Error:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - request_id
      properties:
        code:
          type: string
        message:
          type: string
        request_id: *id004
        field_errors:
          type: object
          additionalProperties:
            type: string
    Login:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
    Session:
      type: object
      additionalProperties: false
      required:
        - owner_id
        - email
        - timezone
        - expires_at
      properties:
        owner_id: *id004
        email:
          type: string
          format: email
        timezone:
          type: string
          const: Europe/Warsaw
        expires_at: &id013
          type: string
          format: date-time
      description: Bez access/refresh tokenów w JSON. Tokeny wyłącznie w HttpOnly
        cookies.
    MutationAck:
      type: object
      additionalProperties: false
      required:
        - resource_id
        - applied_revision
        - current_revision
        - replayed
        - deleted
      properties:
        resource_id: *id004
        applied_revision: &id006
          type: integer
          minimum: 1
          maximum: 2147483647
        current_revision: *id006
        replayed:
          type: boolean
        deleted:
          type: boolean
      description: Po commit. Replay nie wykonuje DML; applied_revision może być starsze
        niż current_revision. UI wykonuje świeży GET. deleted dotyczy tombstone posiłku,
        nie archiwizacji produktu.
    ProductCreate:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - basis_unit
        - kcal_per_100
        - protein_per_100
        - fat_per_100
        - carbs_per_100
      properties:
        id: *id004
        name: &id007
          type: string
          minLength: 1
          maxLength: 160
          description: Po trim; sam biały znak niedozwolony.
        basis_unit: &id012
          type: string
          enum:
            - g
            - ml
        kcal_per_100: &id008
          $ref: "#/components/schemas/Decimal"
        protein_per_100: &id009
          $ref: "#/components/schemas/Decimal"
        fat_per_100: &id010
          $ref: "#/components/schemas/Decimal"
        carbs_per_100: &id011
          $ref: "#/components/schemas/Decimal"
    ProductUpdate:
      type: object
      additionalProperties: false
      required:
        - name
        - kcal_per_100
        - protein_per_100
        - fat_per_100
        - carbs_per_100
      properties:
        name: *id007
        kcal_per_100: *id008
        protein_per_100: *id009
        fat_per_100: *id010
        carbs_per_100: *id011
